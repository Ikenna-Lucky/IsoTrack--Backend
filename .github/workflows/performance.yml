name: Backend load baseline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload profile
        type: choice
        options: [baseline, smoke]
        default: baseline

permissions:
  contents: read

concurrency:
  group: backend-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare isolated database image
        run: docker pull postgres:17-alpine
      - name: Run measured workload
        id: load
        env:
          LOAD_PROFILE: ${{ inputs.profile }}
        run: npm run test:load -- "$LOAD_PROFILE"
      - name: Retain load evidence
        if: ${{ always() && steps.load.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-load-results
          path: reports/load-*.json
          if-no-files-found: error
          retention-days: 14

name: Backend CI

on:
  push:
    branches: [main, isoTrack-dev-branch, isotrack-preview-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/isotrack-preview-branch' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run type-check
      - name: Build
        run: bun run build
      - name: Unit and HTTP handler tests
        id: unit
        run: bun run test:unit
      - name: Retain fast test results
        if: ${{ always() && steps.unit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-unit-results
          path: reports/unit.*
          if-no-files-found: error
          retention-days: 14

  integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare integration service images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
          docker pull quay.io/prometheus/prometheus:v3.13.5
          docker pull quay.io/prometheus/alertmanager:v0.34.2
      - name: Database, queue, recovery and real-time integration tests
        id: integration
        run: node scripts/run-tests.mjs integration ${{ matrix.shard }}/3
      - name: Retain integration results
        if: ${{ always() && steps.integration.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-integration-${{ matrix.shard }}-of-3
          path: |
            reports/integration-${{ matrix.shard }}-of-3.*
            reports/monitoring-*-diagnostic.json
          if-no-files-found: error
          retention-days: 14

  checks:
    needs: [quality, integration, preview_prepare]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every backend job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PREVIEW_RESULT: ${{ needs.preview_prepare.result }}
          PREVIEW_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/isotrack-preview-branch' }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          if [ "$PREVIEW_REQUIRED" = true ]; then
            test "$PREVIEW_RESULT" = success
          else
            test "$PREVIEW_RESULT" = skipped
          fi

  preview_prepare:
    needs: [quality, integration]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/isotrack-preview-branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: preview
    concurrency:
      group: backend-preview-prepare
      cancel-in-progress: false
    env:
      PREVIEW_PREPARE_ENABLED: ${{ vars.PREVIEW_PREPARE_ENABLED }}
      DEPLOYMENT_ENV: preview
      NODE_ENV: production
      RELEASE_SHA: ${{ github.sha }}
      NOTIFICATION_WORKERS_ENABLED: "false"
      RETENTION_ENABLED: "false"
      APP_URL: ${{ vars.PREVIEW_APP_URL }}
      PREVIEW_APP_HOST: ${{ vars.PREVIEW_APP_HOST }}
      LIVE_APP_HOST: ${{ vars.LIVE_APP_HOST }}
      PREVIEW_DATABASE_HOST: ${{ vars.PREVIEW_DATABASE_HOST }}
      LIVE_DATABASE_HOST: ${{ vars.LIVE_DATABASE_HOST }}
      PREVIEW_REDIS_HOST: ${{ vars.PREVIEW_REDIS_HOST }}
      LIVE_REDIS_HOST: ${{ vars.LIVE_REDIS_HOST }}
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      UPSTASH_REDIS_URL: ${{ secrets.PREVIEW_REDIS_URL }}
      PREVIEW_FIXTURE_PASSWORD: ${{ secrets.PREVIEW_FIXTURE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate preview branch, preparation switch and isolated resources
        run: node --input-type=module -e 'import {assertPreviewPreparation} from "./src/lib/preview-isolation.ts"; assertPreviewPreparation(process.env);'
      - name: Build and boot isolated container
        run: |
          docker build --build-arg RELEASE_SHA="$GITHUB_SHA" --tag isotrack-preview-check .
          node scripts/check-preview-image.mjs isotrack-preview-check
      - name: Migrate and prepare only the isolated preview database
        run: bun run src/db/preview-prepare.ts
      - name: Retain preparation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-preview-preparation
          path: reports/preview-preparation.json
          if-no-files-found: warn
          retention-days: 14
